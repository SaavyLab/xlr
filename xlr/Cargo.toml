[package]
name = "xlr"
version = "0.0.2"
description = "An opinionated CLI for letting people and AI agents control a pro audio setup."
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["audio", "dante", "cli", "routing", "agent"]
categories = ["command-line-utilities", "multimedia::audio"]

[[bin]]
name = "xlr"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.53", features = ["derive", "env"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
toml = "1.1.6"
xlr-dante = { version = "0.1.0", path = "../xlr-dante" }
xlr-focusrite = { version = "0.1.0", path = "../xlr-focusrite" }
xlr-pipewire = { version = "0.1.0", path = "../xlr-pipewire" }
rcgen = { version = "0.14.5", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
sha2 = "0.10.9"
